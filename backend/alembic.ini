[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
version_path_separator = os
# Overridden by the DATABASE_URL environment variable (see alembic/env.py).
sqlalchemy.url = postgresql+asyncpg://roomsync:roomsync@postgres:5432/roomsync

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
